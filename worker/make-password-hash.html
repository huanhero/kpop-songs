<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'">
<title>Make password hash</title>
<style>
  :root { color-scheme: light dark; --bg:#f7f5ff; --fg:#1d1b2e; --muted:#6b6880; --line:#d9d4f0; --accent:#8b5cf6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14121f; --fg:#f1eeff; --muted:#a6a2bd; --line:#353049; } }
  body { margin:0; font:16px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:640px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:1.5rem; margin:0 0 .25rem; }
  p.note { color:var(--muted); margin-top:0; }
  label { display:block; font-weight:600; margin:1.2rem 0 .3rem; }
  input, textarea { width:100%; box-sizing:border-box; font:inherit; padding:.55rem .7rem; border:1px solid var(--line); border-radius:10px; background:transparent; color:inherit; }
  textarea { font-family:ui-monospace, Menlo, Consolas, monospace; font-size:.85rem; height:4.2rem; resize:none; }
  button { font:inherit; margin-top:.6rem; padding:.5rem 1rem; border-radius:999px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; }
  button.plain { background:transparent; color:inherit; border-color:var(--line); }
  .warn { color:#b45309; font-weight:600; min-height:1.5em; }
</style>
</head>
<body>
<main>
  <h1>Make the editor password hash</h1>
  <p class="note">Runs entirely on this computer: nothing is sent anywhere (the page is blocked from using the network). Copy the results into the Cloudflare Worker’s settings as <strong>Secrets</strong>.</p>

  <label for="pw">Password for your son</label>
  <input id="pw" type="password" autocomplete="new-password">
  <label for="pw2">Type it again</label>
  <input id="pw2" type="password" autocomplete="new-password">
  <p class="warn" id="msg"></p>
  <button id="go" type="button">Make hash</button>

  <label for="hash">EDITOR_PASSWORD_HASH</label>
  <textarea id="hash" readonly></textarea>
  <button class="plain" type="button" data-copy="hash">Copy</button>

  <label for="secret">SESSION_SECRET (random, new each time)</label>
  <textarea id="secret" readonly></textarea>
  <button class="plain" type="button" data-copy="secret">Copy</button>
</main>
<script>
  // Must match the Worker: PBKDF2-SHA256, 16-byte random salt, 32-byte result.
  // 20,000 rounds fits the Cloudflare free plan's 10 ms CPU budget per request.
  const ITERATIONS = 20000;
  const b64 = (bytes) => btoa(String.fromCharCode(...bytes));
  const $ = (id) => document.getElementById(id);

  const rand = new Uint8Array(48);
  crypto.getRandomValues(rand);
  $('secret').value = b64(rand);

  $('go').addEventListener('click', async () => {
    const pw = $('pw').value;
    $('hash').value = '';
    if (pw !== $('pw2').value) { $('msg').textContent = 'The two passwords are different.'; return; }
    if (pw.length < 10) { $('msg').textContent = 'Use at least 10 characters. Three or four random words work well, e.g. “purple-tiger-moon-42”.'; return; }
    $('msg').textContent = '';
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: ITERATIONS }, key, 256));
    $('hash').value = `pbkdf2-sha256$${ITERATIONS}$${b64(salt)}$${b64(bits)}`;
  });

  document.querySelectorAll('[data-copy]').forEach((b) => b.addEventListener('click', async () => {
    const t = $(b.dataset.copy);
    t.select();
    try { await navigator.clipboard.writeText(t.value); b.textContent = 'Copied ✓'; } catch { document.execCommand('copy'); b.textContent = 'Copied ✓'; }
    setTimeout(() => (b.textContent = 'Copy'), 1500);
  }));
</script>
</body>
</html>
